name: Accessibility (RGAA)

on:
  workflow_call:

jobs:
  rgaa-audit:
    name: ♿ RGAA Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ♿ Run RGAA pack
        run: npm run test:rgaa:auto

      - name: 📤 Upload accessibility reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgaa-reports
          path: cypress/reports/
          retention-days: 7
